name: Build Android APK

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze Project
        run: flutter analyze --no-fatal-infos

      - name: Run Unit Tests
        run: flutter test

      - name: Build Release APK (Version 0.1.x)
        run: flutter build apk --release --build-name=0.1.${{ github.run_number }} --build-number=${{ github.run_number }}

      - name: Upload APK Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ResuMate-v0.1.${{ github.run_number }}-release.apk
          path: build/app/outputs/flutter-apk/app-release.apk
